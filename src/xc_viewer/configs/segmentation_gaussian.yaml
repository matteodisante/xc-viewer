# The Gaussian flight-phase segmenter of the thesis experiments (chapter "Flight
# phases"). Four continuous features are averaged over 30-s windows on a 10-s
# decision grid; a three-state model with full-covariance Gaussian emissions, fitted
# by Baum-Welch on each discipline's cleaned archive (preprocessing 2.3.0), is decoded
# by Viterbi. Nothing is refitted here.
schema_version: 1

features:
  decision_step_s: 10.0
  window_s: 30.0
  # A preprocessing segment logged more slowly than this stays unlabelled.
  max_native_dt_s: 10.0
  # Below this horizontal speed the turn rate is set to zero.
  min_horizontal_speed_mps: 1.0

decoding:
  # Decode the marginal of the fitted Gaussians over the first three features,
  # integrating turn coherence out.
  marginalize_turn_coherence: true
  # Soft preference blended into the fitted transition matrix. Persistence moves
  # towards exp(-step / dwell); exits from search and climb favour the next phase of
  # transition -> search -> climb -> transition, exits from transition are even.
  sequence_policy:
    weight: 0.75
    mean_dwell_s: 120.0
    search_mean_dwell_s: 20.0
    forward_probability: 0.95
    allow_search_skip: true

# Fitted parameters per discipline. Feature order: mean vertical speed [m/s], mean
# horizontal speed [m/s], mean absolute turn rate [rad/s], turn coherence [0, 1].
# Means and covariances are in standardized units, (x - scaler_mean) / scaler_scale.
# state_names[i] names component i; the names are provisional, chosen from the
# emission means (climb: highest vertical speed; transition: fastest and straightest).
